<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JasonLuo - 前端工程师个人简历与博客" />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="color-scheme" content="light dark" />

    <title>JasonLuo · 个人简历</title>

    <script>
      // 主题初始化：在 CSS 与 React 加载前同步设置 data-theme，避免暗色用户首屏闪白
      (function () {
        try {
          var t = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- favicon（public/head.jpg，上线前可替换为 32×32 的 .ico） -->
    <link rel="icon" type="image/jpeg" href="/head.jpg" />

    <!-- Open Graph / Twitter 卡片（分享链接预览；og:url 上线前替换为真实域名） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JasonLuo" />
    <meta property="og:title" content="JasonLuo · 个人简历" />
    <meta property="og:description" content="JasonLuo - 前端工程师个人简历与博客" />
    <meta property="og:image" content="/head.jpg" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta name="twitter:card" content="summary" />
    <!-- canonical：上线前替换为真实域名，SPA 各页面的 canonical 可在路由层动态补充 -->
    <link rel="canonical" href="https://your-domain.com/" />

    <link rel="stylesheet" href="/font/iconfont.css" />
    <link rel="stylesheet" href="/font/iconfont2.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字体样式表改为异步加载，避免渲染阻塞（无网络时回退系统字体） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
