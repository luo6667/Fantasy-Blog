# ─────────────────────────────────────────────────────────────────────────────
# 博客持续集成 / 持续部署（宝塔 + systemd Go + PM2 Next）
#
#   pull_request      → 只跑 verify（Go/前端检查），不碰服务器
#   push main         → verify 通过后发布到服务器
#   workflow_dispatch → 手动 deploy / rollback / bootstrap
#
# 仓库 Settings → Secrets and variables → Actions 需要配置：
#   Secrets:   SSH_HOST / SSH_USER / SSH_PRIVATE_KEY（必填）
#              SSH_PORT / SSH_KNOWN_HOSTS（可选）
#   Variables: APP_ROOT（默认 /www/wwwroot/personal-blog）
#              SITE_URL（可选，默认 https://fantasynote.cloud）
#
# 发布流程（全部在服务器上执行 deploy/deploy.sh）：
#   本地 CI 交叉编译 Linux 后端 → rsync 到 releases/<时间戳>-<sha7>/
#   → 服务器 npm ci + next build → 切 current 软链
#   → systemctl restart blog-server + PM2 reload blog-web
#   → 两端健康检查 → 按需 revalidate → 失败自动回滚
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy=发布 main / rollback=回滚上一版 / bootstrap=初始化新服务器'
        type: choice
        options: [deploy, rollback, bootstrap]
        default: deploy

permissions:
  contents: read

# 同一时间只允许一个发布任务，避免两次部署交叉切换软链
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: 类型检查与 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: blog-fronted/package-lock.json

      - name: 安装前端依赖
        working-directory: blog-fronted
        run: npm ci --include=dev --no-audit --no-fund

      - name: 前端类型检查
        working-directory: blog-fronted
        run: npm run type-check

      - name: 前端 Lint
        working-directory: blog-fronted
        run: npm run lint

      - uses: actions/setup-go@v5
        with:
          go-version-file: blog-server/go.mod
          cache-dependency-path: blog-server/go.sum

      - name: 后端静态检查
        working-directory: blog-server
        run: |
          test -z "$(gofmt -l cmd internal migrations)"
          go vet ./...

      - name: 后端测试
        working-directory: blog-server
        run: go test ./...

      - name: 后端构建（Linux 发布产物）
        working-directory: blog-server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o bin/server ./cmd/server

      - name: 上传后端二进制
        uses: actions/upload-artifact@v4
        with:
          name: blog-server-linux
          path: blog-server/bin/server
          retention-days: 7

  deploy:
    name: 发布到服务器
    needs: verify
    # PR 不部署；main 的 push 与手动触发才部署
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      APP_ROOT: ${{ vars.APP_ROOT || '/www/wwwroot/personal-blog' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://fantasynote.cloud' }}
      SSH_HOST: ${{ secrets.SERVER }}
      SSH_USER: ${{ secrets.USERNAME }}
      SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
      SSH_PRIVATE_KEY: ${{ secrets.CICD }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载后端二进制
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'rollback' }}
        uses: actions/download-artifact@v4
        with:
          name: blog-server-linux
          path: blog-server/bin

      - name: 还原可执行权限
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'rollback' }}
        run: chmod +x blog-server/bin/server

      - name: 准备 SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Secret 里偶尔会被粘成一行、带 \n 字面量或 CRLF，这里统一还原成合法私钥
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! head -1 ~/.ssh/deploy_key | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "::error::SSH_PRIVATE_KEY 首行不是私钥头，请确认复制的是私钥（-----BEGIN OPENSSH PRIVATE KEY-----）而不是公钥"
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY 无法被 OpenSSH 解析：检查是否粘成公钥、丢失换行、带口令，或是 PuTTY .ppk"
            exit 1
          fi
          echo "私钥校验通过：$(ssh-keygen -l -f ~/.ssh/deploy_key)"

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            # 推荐：把服务器公钥指纹固定成 Secret，防中间人
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "使用固定 known_hosts"
          else
            # 退路：首次连接时信任服务器公钥（TOFU），存在中间人风险
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
            echo "::warning::未配置 SSH_KNOWN_HOSTS，已退化为 ssh-keyscan 临时信任主机公钥"
          fi
          chmod 600 ~/.ssh/known_hosts

          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" 'echo "SSH 连通：$(hostname) / node=$(node -v 2>/dev/null || echo 未安装)"'

      - name: 计算发布目录名
        id: rel
        run: |
          set -euo pipefail
          echo "name=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: 同步代码到服务器（rsync）
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'rollback' }}
        run: |
          set -euo pipefail
          REL="${{ steps.rel.outputs.name }}"
          echo "同步到 $APP_ROOT/releases/$REL"
          # 先建目录，这样即使跳过了 bootstrap 也能发布（releases/ 必须存在 rsync 才能创建子目录）
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$APP_ROOT/releases/$REL' '$APP_ROOT/logs'"
          rsync -az --delete --no-owner --no-group \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude 'blog-server/bin/*.exe' \
            --exclude 'blog-server/testdata' \
            --exclude 'blog-server/backups' \
            --exclude 'blog-server/.gocache' \
            --exclude 'blog-server/.gomodcache' \
            --exclude 'blog-server/.gopath' \
            --exclude 'uploads' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '*.tsbuildinfo' \
            --exclude '.idea' \
            --exclude '.vscode' \
            --exclude '.tools' \
            --exclude 'perf-baseline' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ "$SSH_USER@$SSH_HOST:$APP_ROOT/releases/$REL/"

      - name: 初始化服务器（bootstrap）
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap' }}
        run: |
          set -euo pipefail
          REL="${{ steps.rel.outputs.name }}"
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "bash '$APP_ROOT/releases/$REL/deploy/deploy.sh' bootstrap"

      - name: 发布
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action == 'deploy' }}
        run: |
          set -euo pipefail
          REL="${{ steps.rel.outputs.name }}"
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "bash '$APP_ROOT/releases/$REL/deploy/deploy.sh' deploy '$APP_ROOT/releases/$REL'"

      - name: 回滚
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            "bash '$APP_ROOT/current/deploy/deploy.sh' rollback"

      - name: 线上健康检查
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.action != 'rollback' }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "$SITE_URL/api/health" >/dev/null; then
              echo "线上健康：$SITE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::线上健康检查失败：$SITE_URL/api/health"
          exit 1

      - name: 汇总
        if: always()
        run: |
          {
            echo "### 部署结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 动作 | ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'deploy' }} |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 发布目录 | \`${{ steps.rel.outputs.name }}\` |"
            echo "| 站点 | $SITE_URL |"
            echo "| 结果 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
